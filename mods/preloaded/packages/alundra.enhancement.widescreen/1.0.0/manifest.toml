format_version = 11
id = "alundra.enhancement.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "Alundra recomp"
description = "Native-wide 16:9 presentation (16:9 only). Experimental."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00553"

[[feature]]
id = "widescreen"
name = "Widescreen 16:9"
description = "Renders the game in 16:9 (instead of 4:3). Experimental."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "alundra.widescreen"

[[feature]]
id = "hud_corners"
name = "HUD in Bildschirmecken"
description = "Moves the HUD to the screen corners in 16:9 (hearts top left, items bottom left, gilder bottom right). Needs Widescreen."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "hud_corners"
id = "alundra.hud"

[[feature]]
id = "background_color"
name = "Hintergrundfarbe"
description = "Fills the area outside the map/overlay with the room's background colour in 16:9."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "background_color"
id = "alundra.bgcolor"

[[feature]]
id = "map_edge_fade"
name = "Weicher Kartenrand"
description = "Soft fade at the left and right map edge in 16:9."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "map_edge_fade"
id = "alundra.edgefade"

[[feature]]
id = "camera_clamp"
name = "Kamera am Kartenrand begrenzen"
description = "Keeps the camera inside the map in 16:9 (no view past the map edge) in rooms with a known edge. Replaces the soft edge fade there."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "camera_clamp"
id = "alundra.camclamp"

[[feature]]
id = "pillarbox"
name = "Schwarze Seitenbalken (4:3-Szenen)"
description = "Black bars left and right in selected scenes that should only show 4:3."
group = "Visual"
channel = "experimental"
default_enabled = true

[[plugin]]
feature = "pillarbox"
id = "alundra.pillarbox"

[[feature]]
id = "cheat_infinite_hp"
name = "Cheat: Unendlich HP"
description = "Testhilfe: haelt die HP jederzeit auf dem Maximum."
group = "Cheats"
channel = "experimental"
default_enabled = false

[[plugin]]
feature = "cheat_infinite_hp"
id = "alundra.cheat_hp"

[[feature]]
id = "cheat_infinite_money"
name = "Cheat: Unendlich Gilder"
description = "Testhilfe: haelt die Gilder auf 9999."
group = "Cheats"
channel = "experimental"
default_enabled = false

[[plugin]]
feature = "cheat_infinite_money"
id = "alundra.cheat_money"
